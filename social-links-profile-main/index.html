<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Social links profile</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap");

      * {
        font-family: "Inter", sans-serif;
        box-sizing: border-box;
      }
      .attribution {
        font-size: 0.6875rem;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
      body {
        background-color: hsl(0, 0%, 8%);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 0 24px;
      }
      .card {
        width: 100%;
        max-width: 384px;
        padding: 40px 0;
        background-color: hsl(0, 0%, 12%);
        border-radius: 12px;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        gap: 17px;
      }
      img {
        border-radius: 100px;
        width: 88px;
      }
      a {
        background-color: hsl(0, 0%, 20%);
        text-decoration: none;
        width: 100%;
        padding: 14px 0;
        text-align: center;
        border-radius: 10px;
        color: hsl(0, 0%, 100%);
        transition: 0.3s;
      }
      a:hover {
        background-color: hsl(75, 94%, 57%);
        color: hsl(0, 0%, 8%);
      }
      a:focus-visible {
        outline: 3px solid hsl(75, 94%, 57%);
      }
      .white {
        color: hsl(0, 0%, 100%);
      }

      .social {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 13px;
        width: 100%;
        max-width: 300px;
      }
      h1,
      #city,
      #job {
        margin: 0;
      }
      h1 {
        font-size: 24px;
        font-weight: 700;
      }
      #city {
        color: hsl(75, 94%, 57%);
        font-size: 14px;
        font-weight: 600;
      }
      #job {
        font-size: 14px;
        font-weight: 400;
        /* padding: 22px 0 22px 0; */
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="assets/images/avatar-jessica.jpeg" alt="avatar" />
      <h1 class="white">Jessica Randall</h1>
      <p id="city">London, United Kingdom</p>
      <p class="white" id="job">"Front-end developer and avid reader."</p>
      <div class="social">
        <a href="http://">GitHub</a>
        <a href="http://">Frontend Mentor</a>
        <a href="http://">LinkedIn</a>
        <a href="http://">Twitter</a>
        <a href="http://">Instagram</a>
      </div>
    </div>

    <!-- <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Your Name Here</a>.
    </footer> -->
  </body>
</html>
